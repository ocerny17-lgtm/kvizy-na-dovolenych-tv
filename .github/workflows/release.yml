name: Sestavit a vydat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Obnovit podpisový klíč ze secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Chybí secret SIGNING_KEYSTORE_BASE64 – viz README."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Sestavit release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk kvizy-na-dovolenych.apk

      - name: Ověřit podpis
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs kvizy-na-dovolenych.apk

      - name: Smazat podpisový klíč
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Vydat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" kvizy-na-dovolenych.apk \
            --target "$GITHUB_SHA" \
            --title "Kvízy na dovolených $TAG" \
            --notes "Automatické sestavení z commitu ${GITHUB_SHA::7}. Přímý odkaz na nejnovější verzi: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/kvizy-na-dovolenych.apk" \
            --latest
